const SETS={A:"Part A \u2013 Machine Shop Practice & Design (PDF)",B:"Part B \u2013 Slides: standards, stress\u2013strain, forging",C:"Part C \u2013 Slides: hardness, materials, processes"};
const L="abcd",$=i=>document.getElementById(i);
let pool=[],i=0,score=0,missed=[];
$("sets").innerHTML=Object.keys(SETS).map(k=>`<label class="row"><input type="checkbox" value="${k}" checked> ${SETS[k]} (${D.filter(d=>d.p==k).length})</label>`).join("");
function show(id){["setup","play","done"].forEach(s=>$(s).classList.toggle("hide",s!=id))}
function start(list){
  pool=list.slice();
  if($("ord").value=="r"&&!list._retry)for(let j=pool.length-1;j>0;j--){const k=Math.random()*(j+1)|0;[pool[j],pool[k]]=[pool[k],pool[j]]}
  const n=+$("cnt").value;if(n&&!list._retry)pool=pool.slice(0,n);
  i=0;score=0;missed=[];show("play");ask()}
function ask(){
  const d=pool[i];$("pos").textContent=`Question ${i+1} of ${pool.length}`;$("sc").textContent=`Score: ${score}`;
  $("pb").style.width=(i/pool.length*100)+"%";$("tag").textContent=SETS[d.p].split(" \u2013")[0];$("qt").textContent=d.q;
  $("ops").innerHTML="";$("nx").classList.add("hide");
  d.o.forEach((t,k)=>{const b=document.createElement("button");b.className="o";b.innerHTML=`<b>${L[k]}.</b>`;b.append(t);b.onclick=()=>pick(k);$("ops").append(b)})}
function pick(k){
  const d=pool[i],bs=$("ops").children;
  for(let j=0;j<bs.length;j++){bs[j].disabled=true;if(j==d.a)bs[j].classList.add("ok")}
  if(k==d.a)score++;else{bs[k].classList.add("no");missed.push(d)}
  $("sc").textContent=`Score: ${score}`;$("nx").textContent=i+1<pool.length?"Next":"See results";$("nx").classList.remove("hide")}
$("nx").onclick=()=>{i++;i<pool.length?ask():finish()};
function finish(){
  show("done");$("fin").textContent=`${score} / ${pool.length}`;$("pct").textContent=Math.round(score/pool.length*100)+"% correct";
  $("rm").classList.toggle("hide",!missed.length);
  $("ml").innerHTML=missed.length?"<b>Missed questions</b>"+missed.map(d=>`<div class="miss"></div>`).join(""):"Perfect score \u2013 nothing missed.";
  [...$("ml").querySelectorAll(".miss")].forEach((e,k)=>{const d=missed[k];e.textContent=d.q;const s=document.createElement("small");s.textContent=` Answer: ${L[d.a]}. ${d.o[d.a]}`;e.append(document.createElement("br"),s)})}
$("go").onclick=()=>{const on=[...document.querySelectorAll("#sets input:checked")].map(c=>c.value);if(!on.length)return;start(D.filter(d=>on.includes(d.p)))};
$("rm").onclick=()=>{const m=missed.slice();m._retry=1;start(m)};
$("again").onclick=()=>show("setup");
</script></body></html>
